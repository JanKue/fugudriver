# input to RLModule model_config
rl_module:
  hidden_dim: 256
  single_enc_dim: 128

# Inputs to AlgorithmConfig builder methods; see RLlib documentation for possible settings
env_runners:
  num_env_runners: 0
  num_cpus_per_env_runner: 1
  num_envs_per_env_runner: 1
  batch_mode: "truncate_episodes"
  rollout_fragment_length: 91 # if not 'auto', might be overriden and set to episode length
learners:
  num_learners: 0
  num_gpus_per_learner: 0 # activate GPUs by setting this to >0
  num_cpus_per_learner: "auto" # 'auto' -> only use CPU if GPU is not enabled
training:
  # General settings
  lr: 0.01
  gamma: 0.99
  train_batch_size_per_learner: null
  num_epochs: 30
  minibatch_size: 128
  shuffle_batch_per_epoch: False
  grad_clip: null
  # PPO-specific settings
  use_critic: True
  use_gae: True
  lambda_: 1.0 # lambda for GAE
  use_kl_loss: True
  kl_coeff: 0.2
  kl_target: 0.01
  vf_loss_coeff: 1.0
  entropy_coeff: 0.0
  clip_param: 0.3
  vf_clip_param: 10.0
